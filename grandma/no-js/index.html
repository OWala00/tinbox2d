<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No JavaScript</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 32px 20px; background: #0d0f12; color: #c9d1dc; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; background: #151922; border: 1px solid #262c38; border-radius: 8px; padding: 24px; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0 0 12px; }
    .quote { color: #7d8794; font-style: italic; }
    a { color: #4f9dff; }
  </style>
</head>
<body>
  <main>
    <h1>No JavaScript</h1>
    <p class="quote">Back in my day a website was words and a picture, and we liked it.</p>
    <p>HTML and CSS only. There is no script tag on this page.</p>
    <p><a href="../">Back to the house</a></p>
  </main>
</body>
</html>
