<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>tinbox2d</title>
  <style>
    body { margin: 0; background: #1a1a1a; display: flex; align-items: center; justify-content: center; height: 100vh; }
    canvas { background: #111; border: 1px solid #333; }
  </style>
</head>
<body>
  <canvas id="view" width="640" height="480"></canvas>
  <script type="module">
    const canvas = document.getElementById('view');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#444';
    ctx.font = '14px monospace';
    ctx.fillText('tinbox2d — nothing to simulate yet', 20, 30);
  </script>
</body>
</html>
